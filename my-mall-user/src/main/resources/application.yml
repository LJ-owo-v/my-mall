server:
  port: 8086

spring:
  application:
    name: my-mall-user
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: root123
      timeout: 5000ms


# ★ Sa-Token 配置必须与网关/原 mall-admin 完全一致
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false
  jwt-secret-key: sa-secret-key123

# MyBatis
mybatis:
  mapper-locations:
    - classpath:mapper/*.xml
    - classpath:dao/*.xml
  configuration:
    map-underscore-to-camel-case: true

# ★8 用户缓存三属性：UmsAdminCacheServiceImpl 用 @Value 注入且无默认值，缺一个就启动失败
redis:
  database: mall-swarm
  key:
    # ★9 灰度期缓存隔离：不复用老 mall-admin 的 ums:admin
    #    原因：Redis 存的是带 "@class" 的 JSON，两个服务写同一个 key 会互相读到对方包名的 PO
    admin: my-ums:admin
  expire:
    common: 86400

# PageHelper
pagehelper:
  helper-dialect: mysql
  support-methods-arguments: true

# 运维端点收敛
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
