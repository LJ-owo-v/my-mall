server:
  port: 8092                      # ← 各服务不同（见 §2 表格）

spring:
  application:
    name: my-mall-portal         # ← 各服务不同

  config:
    import:
      # ★ 写死 dataId（不要用 ${spring.profiles.active} 占位符：
      #   import 发生在配置加载早期，占位符可能还没解析 → 会去找 "my-mall-product-.yaml"）
      - optional:nacos:my-mall-portal-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        namespace: 9883b8e5-fd64-49bc-8e24-d21d5690b8d0
        file-extension: yaml          # ★ 必须是 yaml
        group: DEFAULT_GROUP
      discovery:                      # 从原 application-dev.yml 合并进来
        server-addr: localhost:8848
        namespace: 9883b8e5-fd64-49bc-8e24-d21d5690b8d0